# Jujutsu: Git-compatible version control where every operation can be undone (jj undo).
# Works in any existing git repo: `jj git init --colocate` once, then git and jj side by side.
[user]
name = "vango"
email = "viktorlilienberg@gmail.com"

[ui]
default-command = "log"
# syntax-aware diffs: needs difftastic (pacman -S difftastic)
diff-formatter = ["difft", "--color=always", "$left", "$right"]
paginate = "auto"

[aliases]
# jj l: the last 20 changes, compact
l = ["log", "-r", "ancestors(@, 20)"]
