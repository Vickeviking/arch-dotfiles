# This is a file where you put your own default apps, default search Engine etc

# NOTE (2026-08-31): after the Lua config migration, Hyprland itself no longer
# sources this file -- it reads UserConfigs/user_defaults.lua instead.
# This file is still parsed by the shell scripts in ~/.config/hypr/scripts and
# ~/.config/hypr/UserScripts (WaybarScripts.sh, Kool_Quick_Settings.sh,
# RofiSearch.sh, KeyBinds.sh, SwitchKeyboardLayout.sh, WallpaperSelect.sh,
# Tak0-Per-Window-Switch.sh), which is why it must exist.
# Keep the values below in sync with UserConfigs/user_defaults.lua.

# Set your default editor here uncomment and reboot to take effect.
# NOTE, this will be automatically uncommented if you select neovim or vim to your default editor
env = EDITOR,nvim #default editor

# Define preferred text editor for the KooL Quick Settings Menu (SUPER SHIFT E)
# script will take the default EDITOR and nano as fallback
$edit=${EDITOR:-nano}

# These two are for UserKeybinds.conf & Waybar Modules
$term = kitty # Terminal
$files = thunar # File Manager

# Default Search Engine for ROFI Search (SUPER S)
$Search_Engine = "https://www.google.com/search?q={}"
