# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/00-Default.conf

font_family FantasqueSansM Nerd Font Mono Bold
font_size 16.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 8 12

# Colors come from desk-theme (switch with `desk-theme <name>`); kept last so it wins.
# Previous hard-coded colors: foreground #dddddd, background #000000, cursor #dddddd.
include ~/.config/themes/current/kitty.conf
# Don't restore the last window's maximized state on new windows
remember_window_size no
